[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "oxli"
description = "oxli is a Rust library + Python interface for counting k-mers in genomic sequencing data."

authors = [{ name = "C. Titus Brown" }, { name = "Adam Taranto" }]

maintainers = [{ name = "C. Titus Brown", email = "ctbrown@ucdavis.edu" }]

readme = "README.md"

requires-python = ">=3.10"

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

dynamic = ["version"]

license = { file = "LICENSE" }

[tool.maturin]
features = ["pyo3/extension-module"]
# Mixed Rust/Python layout: the compiled extension is placed inside the `oxli`
# package under `src/python`, alongside the type stubs (__init__.pyi + py.typed).
python-source = "src/python"
module-name = "oxli.oxli"

[project.optional-dependencies]
test = ["pytest>=7.0", "toml>=0.10", "scipy"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["src/python/tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "C", # mccabe rules
    "F", # pyflakes rules
    "E", # pycodestyle error rules
    "W", # pycodestyle warning rules
    "B", # flake8-bugbear rules
    "I", # isort rules
]
ignore = [
    "C901", # max-complexity-10
    "E501", # line-too-long
    "I001", # isort-imports
    "B905", # `zip()` without an explicit `strict=` parameter
]

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.isort]
profile = "black"
known_third_party = ["scipy"]
known_first_party = ["oxli"]
default_section = "THIRDPARTY"
force_sort_within_sections = true

[tool.numpydoc_validation]
checks = [
    "all",  # report on all checks
    "ES01", # but don't require an extended summary
    "EX01", # or examples
    "SA01", # or a see also section
    "SS06", # and don't require the summary to fit on one line
]
exclude = [ # don't report on checks for these
    '\.__init__$',
    '\.__repr__$',
    '\.__str__$',
]
