[package]
name = "oxli"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "oxli"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.89"
env_logger = "0.11.5"
log = "0.4.22"
needletail = "0.5.1"
# Disable niffler's `lzma` feature: it links the native `lzma` library via
# liblzma-sys, which conflicts with needletail's own lzma binding (xz2 -> lzma-sys).
# Table save/load only uses gzip, so gz/bz2 backends are sufficient here.
niffler = { version = "2.6.0", default-features = false, features = ["gz", "bz2"] }
pyo3 = { version="0.22.3", features = ["extension-module", "anyhow"] }
rayon = "1.10.0"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sourmash = "0.15.1"
