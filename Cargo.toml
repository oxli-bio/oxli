[package]
name = "oxli"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "oxli"
crate-type = ["cdylib", "rlib"]
bench = false

[[bench]]
name = "genome"
harness = false

[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
env_logger = "0.11.10"
log = "0.4.30"
needletail = "0.7.3"
# Restrict niffler to the gzip backend. Its default `lzma` feature links the
# native `lzma` library via liblzma-sys, which conflicts with needletail's own
# lzma binding (xz2 -> lzma-sys). Table save/load only uses gzip, so gz alone is
# sufficient (sourmash separately pulls in niffler's gz + zstd backends).
niffler = { version = "3.0.1", default-features = false, features = ["gz"] }
# Identity hasher for the count maps: the keys are already well-distributed
# 64-bit MurmurHash values, so re-hashing them (as the default SipHash does)
# is pure overhead. `nohash-hasher` uses the key directly as the bucket index.
nohash-hasher = "0.2.0"
pyo3 = { version = "0.29.0", features = ["anyhow"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sourmash = "0.23.0"

[dev-dependencies]
criterion = { version = "5.0.1", package = "codspeed-criterion-compat" }
# The benchmarks call the `#[pymethods]` API directly, which takes a `Python`
# token (methods release the GIL internally). `auto-initialize` lets the bench
# binary start an embedded interpreter so `Python::with_gil` works; this feature
# is only pulled for the bench build, never for the maturin extension build.
pyo3 = { version = "0.29.0", features = ["auto-initialize"] }

[lints.rust]
# `Py_GIL_DISABLED` is a cfg set by pyo3's build script on free-threaded
# CPython builds; declare it so it is not flagged as an unexpected cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(Py_GIL_DISABLED)'] }

[features]
extension-module = ["pyo3/extension-module"]
# Opt-in stable-ABI (abi3) build. Enabled by CI for the GIL builds so a single
# wheel serves CPython 3.10+; deliberately NOT a default feature because the
# free-threaded ABI does not support abi3, and a default would break source
# builds on free-threaded interpreters (`pip install` from sdist on 3.14t).
abi3 = ["pyo3/abi3-py310"]
